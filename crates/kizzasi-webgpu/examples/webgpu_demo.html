<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kizzasi WebGPU Demo — SiLU Kernel</title>
<style>
  body { font-family: monospace; padding: 2em; background: #1a1a2e; color: #e0e0e0; }
  h1 { color: #a0c4ff; margin-bottom: 0.5em; }
  p  { color: #b0b0c0; margin-top: 0; }
  pre  { background: #16213e; padding: 1em; border-radius: 6px; overflow: auto; color: #c8f0c8; line-height: 1.5; }
  button {
    padding: 0.5em 1.5em; font-size: 1em; cursor: pointer;
    background: #0f3460; color: #e0e0e0; border: none; border-radius: 4px;
    margin-bottom: 1em;
  }
  button:hover { background: #533483; }
  .error { color: #ff8080; }
  .label { color: #80c0ff; }
</style>
</head>
<body>
<h1>Kizzasi WebGPU — SiLU Kernel Demo</h1>
<p>
  Runs the SiLU activation (<code>x / (1 + exp(-x))</code>) on the GPU via the
  native browser WebGPU API.  No WASM needed — pure JavaScript dispatches the
  WGSL compute shader.
</p>
<button id="run">Run on GPU</button>
<pre id="output">Press "Run on GPU" to start...</pre>

<script>
// ── WGSL shader source ────────────────────────────────────────────────────────
// Matches crates/kizzasi-webgpu/src/shaders/silu.wgsl (3-binding layout).
const WGSL = `
struct SiluParams { n: u32 }

@group(0) @binding(0) var<uniform>             params: SiluParams;
@group(0) @binding(1) var<storage, read>       input:  array<f32>;
@group(0) @binding(2) var<storage, read_write> output: array<f32>;

fn silu_scalar(x: f32) -> f32 {
    return x / (1.0 + exp(-x));
}

@compute @workgroup_size(256, 1, 1)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
    let i: u32 = gid.x;
    if i >= params.n { return; }
    output[i] = silu_scalar(input[i]);
}
`;

// ── GPU SiLU dispatch ─────────────────────────────────────────────────────────
async function runGpuSilu(values) {
    if (!navigator.gpu) {
        throw new Error("WebGPU not supported in this browser");
    }
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
        throw new Error("No GPU adapter found");
    }
    const device = await adapter.requestDevice();

    const n = values.length;
    const byteLen = n * 4;

    // Uniform buffer: { n: u32 } = 4 bytes
    const uniformBuf = device.createBuffer({
        size: 4,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const uniformArr = new Uint32Array([n]);
    device.queue.writeBuffer(uniformBuf, 0, uniformArr);

    // Input buffer
    const inputBuf = device.createBuffer({
        size: byteLen,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(inputBuf, 0, new Float32Array(values));

    // Output buffer (GPU-side write target)
    const outputBuf = device.createBuffer({
        size: byteLen,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
    });

    // Staging buffer for CPU readback
    const stagingBuf = device.createBuffer({
        size: byteLen,
        usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
    });

    // Compile shader and build pipeline
    const shaderModule = device.createShaderModule({ code: WGSL });
    const pipeline = device.createComputePipeline({
        layout: 'auto',
        compute: { module: shaderModule, entryPoint: 'main' },
    });

    const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: uniformBuf } },
            { binding: 1, resource: { buffer: inputBuf  } },
            { binding: 2, resource: { buffer: outputBuf } },
        ],
    });

    // Record and submit commands
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.dispatchWorkgroups(Math.ceil(n / 256));
    pass.end();
    encoder.copyBufferToBuffer(outputBuf, 0, stagingBuf, 0, byteLen);
    device.queue.submit([encoder.finish()]);

    // Readback
    await stagingBuf.mapAsync(GPUMapMode.READ);
    const result = new Float32Array(stagingBuf.getMappedRange().slice(0));
    stagingBuf.unmap();

    // Clean up
    uniformBuf.destroy();
    inputBuf.destroy();
    outputBuf.destroy();
    stagingBuf.destroy();
    device.destroy();

    return Array.from(result);
}

// ── CPU reference ─────────────────────────────────────────────────────────────
function cpuSilu(values) {
    return values.map(x => x / (1 + Math.exp(-x)));
}

// ── Demo runner ───────────────────────────────────────────────────────────────
document.getElementById('run').addEventListener('click', async () => {
    const out = document.getElementById('output');
    out.className = '';
    out.textContent = 'Initializing WebGPU and dispatching compute shader...';

    const input = [-3, -2, -1, -0.5, 0, 0.5, 1, 2, 3];

    try {
        const t0 = performance.now();
        const gpuResult = await runGpuSilu(input);
        const elapsed = (performance.now() - t0).toFixed(1);

        const cpuRef = cpuSilu(input);
        const maxErr = Math.max(
            ...gpuResult.map((v, i) => Math.abs(v - cpuRef[i]))
        );

        const fmt = arr => arr.map(x => x.toFixed(4)).join(', ');

        let text = '';
        text += 'Input:   [' + input.join(', ') + ']\n\n';
        text += 'GPU out: [' + fmt(gpuResult) + ']\n';
        text += 'CPU ref: [' + fmt(cpuRef)    + ']\n\n';
        text += 'Max |GPU − CPU| error: ' + maxErr.toExponential(2) + '\n';
        text += 'Kernel dispatch time:  ' + elapsed + ' ms\n\n';
        text += maxErr < 1e-4
            ? 'PASS — GPU and CPU results agree within tolerance.'
            : 'FAIL — results differ beyond tolerance (check browser console).';

        out.textContent = text;
    } catch (err) {
        out.className = 'error';
        out.textContent = 'Error: ' + err.message;
        console.error(err);
    }
});
</script>
</body>
</html>
