[package]
name = "kizzasi-logic"
description = "TensorLogic bridge for Kizzasi - constraint enforcement and safety guardrails"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["constraints", "optimization", "guardrails", "safety", "verification"]
categories = ["algorithms", "mathematics"]
readme = "README.md"
documentation = "https://docs.rs/kizzasi-logic"
homepage = "https://github.com/cool-japan/kizzasi"

[features]
default = ["std"]
std = []
# GPU features (optional - propagate to kizzasi-core)
cuda = ["kizzasi-core/cuda"]
metal = ["kizzasi-core/metal"]
# Logic features
qp-solver = ["osqp"]
gpu = []

[dependencies]
# Internal crates
kizzasi-core.workspace = true

# COOLJAPAN Ecosystem (following KIZZASI_POLICY.md)
scirs2-core.workspace = true
tensorlogic-ir.workspace = true

# Parallelism (used by distributed_admm for parallel x-updates)
rayon.workspace = true

# Core dependencies
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true

# Optional QP solver
osqp = { version = "1.0", optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "projection_benchmarks"
harness = false

[[bench]]
name = "comprehensive_benchmarks"
harness = false
