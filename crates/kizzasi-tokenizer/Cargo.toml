[package]
name = "kizzasi-tokenizer"
description = "Signal quantization and tokenization for Kizzasi AGSP - VQ-VAE, μ-law, continuous embeddings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["vq-vae", "quantization", "compression", "audio", "tokenization"]
categories = ["compression", "multimedia::audio"]
readme = "README.md"
documentation = "https://docs.rs/kizzasi-tokenizer"
homepage = "https://github.com/cool-japan/kizzasi"

[features]
default = ["std"]
std = []
# GPU features (optional)
# Note: cuda feature only works on Linux/Windows, ignored on macOS
cuda = ["kizzasi-core/cuda"]
metal = ["kizzasi-core/metal"]
# Tokenizer features
vqvae = []
mulaw = []
parallel = ["dep:rayon"]

[dependencies]
# Internal crates
kizzasi-core.workspace = true

# COOLJAPAN Ecosystem
scirs2-core.workspace = true

# Core dependencies
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
oxicode.workspace = true
chrono.workspace = true
safetensors.workspace = true


# Parallel processing (optional)
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

# Platform-specific Candle dependencies
# CUDA is only supported on Linux and Windows (not macOS)
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
candle-core = { version = "0.9.1", default-features = false, features = [] }
candle-nn = { version = "0.9.1", default-features = false, features = [] }

# macOS uses Metal (or CPU-only by default)
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9.1", default-features = false, features = [] }
candle-nn = { version = "0.9.1", default-features = false, features = [] }

[[bench]]
name = "tokenizer_benchmarks"
harness = false

[[bench]]
name = "comprehensive_benchmarks"
harness = false
