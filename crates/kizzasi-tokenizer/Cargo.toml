[package]
name = "kizzasi-tokenizer"
description = "Signal quantization and tokenization for Kizzasi AGSP - VQ-VAE, μ-law, continuous embeddings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["vq-vae", "quantization", "compression", "audio", "tokenization"]
categories = ["compression", "multimedia::audio"]
readme = "README.md"
documentation = "https://docs.rs/kizzasi-tokenizer"
homepage = "https://github.com/cool-japan/kizzasi"

[features]
default = ["std"]
std = []
# GPU features (optional)
# Note: cuda feature only works on Linux/Windows, ignored on macOS
cuda = ["kizzasi-core/cuda"]
metal = ["kizzasi-core/metal"]
# Tokenizer features
vqvae = []
mulaw = []
parallel = ["dep:rayon"]
# WebAssembly support (opt-in, exposes JS bindings via wasm-bindgen)
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
# COOLJAPAN Ecosystem
scirs2-core.workspace = true
oxifft.workspace = true

# Core dependencies
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
oxicode.workspace = true
chrono.workspace = true
safetensors.workspace = true

# Parallel processing (optional)
rayon = { workspace = true, optional = true }

# WebAssembly bindings (optional, only meaningful for wasm32 target)
wasm-bindgen = { version = "0.2.126", optional = true }
js-sys = { version = "0.3.103", optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
kizzasi-inference = { path = "../kizzasi-inference" }

# Platform-specific Candle dependencies
# CUDA is only supported on Linux and Windows (not macOS), and never on wasm32
[target.'cfg(all(any(target_os = "linux", target_os = "windows"), not(target_arch = "wasm32")))'.dependencies]
candle-core = { version = "0.11.0", default-features = false, features = [] }
candle-nn = { version = "0.11.0", default-features = false, features = [] }

# macOS uses Metal (or CPU-only by default), never on wasm32
[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
candle-core = { version = "0.11.0", default-features = false, features = [] }
candle-nn = { version = "0.11.0", default-features = false, features = [] }

# kizzasi-core is not wasm32-compatible (uses candle, std::fs, std::thread)
# Include it only on native targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kizzasi-core.workspace = true

# wasm32 requires special RNG backends — uuid needs the `js` feature for wasm32-unknown-unknown
# getrandom needs `wasm_js` for rand_core. Cargo unifies these features at resolution time.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }

[[bench]]
name = "tokenizer_benchmarks"
harness = false

[[bench]]
name = "comprehensive_benchmarks"
harness = false

[[bench]]
name = "range_coder_bench"
harness = false
