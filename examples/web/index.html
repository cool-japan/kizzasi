<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizzasi - Browser Signal Quantization Demo</title>
<style>
  :root {
    --bg: #0e1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem;
    width: 100%;
    max-width: 720px;
    margin-bottom: 1rem;
  }
  .panel h2 { font-size: 1rem; margin-bottom: 0.8rem; color: var(--accent); }
  .control-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 0.6rem;
  }
  .control-row label { min-width: 90px; font-size: 0.85rem; color: var(--muted); }
  .control-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .control-row .val { min-width: 50px; text-align: right; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .radio-group { display: flex; gap: 1rem; }
  .radio-group label { min-width: auto; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
  .radio-group input { accent-color: var(--accent); }
  button#run {
    display: block;
    width: 100%;
    padding: 0.6rem;
    margin-top: 0.6rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button#run:hover { opacity: 0.85; }
  button#run:disabled { opacity: 0.4; cursor: not-allowed; }
  canvas {
    width: 100%;
    height: 220px;
    background: var(--bg);
    border-radius: 6px;
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.8rem;
    text-align: center;
  }
  .metric-box { padding: 0.6rem; background: var(--bg); border-radius: 6px; }
  .metric-box .label { font-size: 0.75rem; color: var(--muted); }
  .metric-box .value { font-size: 1.3rem; font-weight: 600; margin-top: 0.2rem; }
  .metric-box .value.snr { color: var(--green); }
  .metric-box .value.mse { color: var(--red); }
  .metric-box .value.cr { color: var(--accent); }
  .legend { display: flex; gap: 1.5rem; justify-content: center; margin-top: 0.5rem; font-size: 0.8rem; }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 14px; height: 3px;
    margin-right: 5px;
    vertical-align: middle;
    border-radius: 2px;
  }
  .legend .orig::before { background: var(--accent); }
  .legend .recon::before { background: var(--green); }
  #status { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; }
</style>
</head>
<body>

<h1>Kizzasi Signal Quantization</h1>
<p class="subtitle">Browser-based demo powered by WebAssembly</p>

<div class="panel">
  <h2>Signal Parameters</h2>
  <div class="control-row">
    <label>Frequency</label>
    <input type="range" id="freq" min="1" max="20" step="0.5" value="3">
    <span class="val" id="freq-val">3.0 Hz</span>
  </div>
  <div class="control-row">
    <label>Amplitude</label>
    <input type="range" id="amp" min="0.1" max="1.0" step="0.05" value="0.8">
    <span class="val" id="amp-val">0.80</span>
  </div>
  <div class="control-row">
    <label>Noise</label>
    <input type="range" id="noise" min="0" max="0.5" step="0.01" value="0.05">
    <span class="val" id="noise-val">0.05</span>
  </div>
</div>

<div class="panel">
  <h2>Quantization</h2>
  <div class="control-row">
    <label>Bit Depth</label>
    <input type="range" id="bits" min="1" max="16" step="1" value="8">
    <span class="val" id="bits-val">8 bits</span>
  </div>
  <div class="control-row">
    <label>Codec</label>
    <div class="radio-group">
      <label><input type="radio" name="codec" value="linear" checked> Linear</label>
      <label><input type="radio" name="codec" value="mulaw"> &mu;-law</label>
    </div>
  </div>
  <button id="run" disabled>Loading WASM&hellip;</button>
</div>

<div class="panel">
  <h2>Visualization</h2>
  <canvas id="canvas"></canvas>
  <div class="legend">
    <span class="orig">Original</span>
    <span class="recon">Reconstructed</span>
  </div>
</div>

<div class="panel">
  <h2>Quality Metrics</h2>
  <div class="metrics">
    <div class="metric-box"><div class="label">SNR</div><div class="value snr" id="m-snr">&mdash;</div></div>
    <div class="metric-box"><div class="label">MSE</div><div class="value mse" id="m-mse">&mdash;</div></div>
    <div class="metric-box"><div class="label">Compression</div><div class="value cr" id="m-cr">&mdash;</div></div>
  </div>
</div>

<div id="status">Initializing&hellip;</div>

<script>
(function () {
  const worker = new Worker("worker.js");
  const btnRun = document.getElementById("run");
  const status = document.getElementById("status");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // Slider display bindings
  const sliders = [
    { id: "freq", display: "freq-val", fmt: v => parseFloat(v).toFixed(1) + " Hz" },
    { id: "amp",  display: "amp-val",  fmt: v => parseFloat(v).toFixed(2) },
    { id: "noise", display: "noise-val", fmt: v => parseFloat(v).toFixed(2) },
    { id: "bits", display: "bits-val", fmt: v => v + " bits" },
  ];
  sliders.forEach(function (s) {
    const el = document.getElementById(s.id);
    const disp = document.getElementById(s.display);
    el.addEventListener("input", function () { disp.textContent = s.fmt(el.value); });
  });

  // Worker message handler
  worker.addEventListener("message", function (e) {
    const msg = e.data;
    if (msg.type === "ready") {
      btnRun.disabled = false;
      btnRun.textContent = "Generate & Quantize";
      status.textContent = "WASM loaded. Ready.";
    } else if (msg.type === "result") {
      drawSignals(msg.original, msg.reconstructed);
      document.getElementById("m-snr").textContent = isFinite(msg.snr) ? msg.snr.toFixed(2) + " dB" : "\u221E dB";
      document.getElementById("m-mse").textContent = msg.mse.toExponential(3);
      document.getElementById("m-cr").textContent = msg.compression_ratio.toFixed(1) + "x";
      status.textContent = "Done. " + msg.original.length + " samples processed.";
      btnRun.disabled = false;
    } else if (msg.type === "error") {
      status.textContent = "Error: " + msg.message;
      btnRun.disabled = false;
    }
  });

  // Initialize WASM in worker
  worker.postMessage({ type: "init" });

  // Run button
  btnRun.addEventListener("click", function () {
    btnRun.disabled = true;
    status.textContent = "Processing\u2026";

    const freq = parseFloat(document.getElementById("freq").value);
    const amp = parseFloat(document.getElementById("amp").value);
    const noiseLvl = parseFloat(document.getElementById("noise").value);
    const bits = parseInt(document.getElementById("bits").value, 10);
    const codec = document.querySelector('input[name="codec"]:checked').value;

    // Generate signal: sine wave with additive noise, 512 samples at 44100 Hz conceptual rate
    const N = 512;
    const signal = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const t = i / N;
      signal[i] = amp * Math.sin(2 * Math.PI * freq * t) + noiseLvl * (Math.random() * 2 - 1);
    }

    worker.postMessage({ type: codec === "mulaw" ? "mulaw" : "quantize", signal: signal, bits: bits });
  });

  // Canvas drawing
  function drawSignals(original, reconstructed) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const w = rect.width;
    const h = rect.height;
    const pad = 16;
    const plotW = w - pad * 2;
    const plotH = h - pad * 2;

    ctx.clearRect(0, 0, w, h);

    // Grid
    ctx.strokeStyle = "#21262d";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad + (plotH / 4) * i;
      ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad + plotW, y); ctx.stroke();
    }

    // Zero line
    const zeroY = pad + plotH / 2;
    ctx.strokeStyle = "#30363d";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, zeroY); ctx.lineTo(pad + plotW, zeroY); ctx.stroke();

    // Find amplitude range
    let absMax = 0;
    for (let i = 0; i < original.length; i++) {
      const a = Math.abs(original[i]);
      if (a > absMax) absMax = a;
      const b = Math.abs(reconstructed[i]);
      if (b > absMax) absMax = b;
    }
    if (absMax < 1e-9) absMax = 1;

    function drawLine(data, color, lineW) {
      ctx.strokeStyle = color;
      ctx.lineWidth = lineW;
      ctx.beginPath();
      for (let i = 0; i < data.length; i++) {
        const x = pad + (i / (data.length - 1)) * plotW;
        const y = zeroY - (data[i] / absMax) * (plotH / 2);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    drawLine(original, "#58a6ff", 1.5);
    drawLine(reconstructed, "#3fb950", 1.5);
  }
})();
</script>
</body>
</html>
