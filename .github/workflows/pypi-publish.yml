# PyPI Publishing Workflow for Kizzasi
# Builds Python wheels for all platforms using maturin and publishes to PyPI.
# Mirrors the quantrs publishing pattern.
#
# Trigger modes:
#   - Push a tag like "v0.2.0"      → publishes to PyPI
#   - Push a tag like "v0.2.0-rc1"  → publishes to TestPyPI
#   - workflow_dispatch              → manual (choose testpypi / pypi / none)
#
# OIDC trusted publishing is used (no API token secret required).
# Configure environments "pypi" and "testpypi" in GitHub repo settings
# with the matching trusted publisher entries on pypi.org / test.pypi.org.

name: PyPI Publish

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
          - none
      version_tag:
        description: 'Version tag (e.g., v0.2.0)'
        required: false
        type: string

  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: "1.8"

jobs:
  # ── Linux wheels (x86_64 + aarch64) ────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
          working-directory: crates/kizzasi-python
          before-script-linux: |
            yum install -y openssl-devel perl-IPC-Cmd || \
            apt-get install -y libssl-dev || true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/kizzasi-python/dist

  # ── macOS wheels (x86_64 + arm64) ──────────────────────────────────────────
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          working-directory: crates/kizzasi-python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: crates/kizzasi-python/dist

  # ── Windows wheels ──────────────────────────────────────────────────────────
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
          working-directory: crates/kizzasi-python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: crates/kizzasi-python/dist

  # ── Source distribution ─────────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/kizzasi-python

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/kizzasi-python/dist

  # ── Publish ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: ${{ (github.event.inputs.publish_target == 'pypi' || (github.event_name == 'push' && !contains(github.ref, 'rc'))) && 'pypi' || 'testpypi' }}
      url: ${{ (github.event.inputs.publish_target == 'pypi' || (github.event_name == 'push' && !contains(github.ref, 'rc'))) && 'https://pypi.org/project/kizzasi/' || 'https://test.pypi.org/project/kizzasi/' }}
    permissions:
      id-token: write  # OIDC trusted publishing — no API token needed
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List dist contents
        run: ls -la dist/

      # Publish to TestPyPI (rc tags or explicit testpypi target)
      - name: Publish to TestPyPI
        if: >
          github.event.inputs.publish_target == 'testpypi' ||
          (github.event_name == 'push' && contains(github.ref, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

      # Publish to PyPI (non-rc tags or explicit pypi target)
      - name: Publish to PyPI
        if: >
          github.event.inputs.publish_target == 'pypi' ||
          (github.event_name == 'push' && !contains(github.ref, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
